name: Build Kick Bass Space

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar el proyecto con CMake
        run: cmake -B build -S KickBassSpace -G "Visual Studio 17 2022" -A x64

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Subir el VST3
        uses: actions/upload-artifact@v4
        with:
          name: KickBassSpace-Windows
          path: |
            build/KickBassSpace_artefacts/Release/VST3/**
            build/KickBassSpace_artefacts/Release/Standalone/**
